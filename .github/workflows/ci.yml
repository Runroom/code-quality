name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  image:
    runs-on: ubuntu-latest
    needs: [unit, actionlint]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: code-quality:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm code-quality:ci versions
      - run: docker run --rm code-quality:ci doctor
      - name: Install PHP fixture dependencies
        run: docker run --rm -v "$PWD/fixtures/php-project:/work" -w /work --user "$(id -u):$(id -g)" --entrypoint composer code-quality:ci install --no-interaction
      - name: Fixture integration
        run: CODE_QUALITY_IMAGE=code-quality:ci node scripts/integration.ts
      - name: Dogfood
        run: docker run --rm -v "$PWD:/work" --user "$(id -u):$(id -g)" -e GITHUB_ACTIONS=true -e GITHUB_STEP_SUMMARY=/work/artifacts/step-summary.md code-quality:ci check
      - name: Publish dogfood summary
        if: always()
        run: cat artifacts/step-summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dogfood-artifacts
          path: artifacts/
          retention-days: 14
